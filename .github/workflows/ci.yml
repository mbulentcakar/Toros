name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  root:
    name: Root
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Root summary fixtures
        run: node --test .github/scripts/root-test-summary.test.mjs

      - name: Test and summarize skips
        run: node .github/scripts/run-root-tests.mjs

  cockpit:
    name: Cockpit
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cockpit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json

      - name: Install Cockpit dependencies
        run: npm ci

      - name: Test Cockpit
        run: npm run test -- --run

      - name: Build Cockpit frontend
        run: npm run build

  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cockpit/src-tauri
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: 1.97.1

      - name: Test Rust shell
        run: cargo test --locked

      - name: Check Rust shell
        run: cargo check
